<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <br><br>
        <h1 class="display-5">Login Form</h1>
        <hr>
        <form action="Login" method="post">
            <table>
                <tr>
                    <td>UserID</td>
                    <td><input type="text" name="userid" required class="form-control" autocomplete="off"></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td><input type="password" name="pswd" required class="form-control" autocomplete="off"></td>
                </tr>
                <tr>
                    <td colspan="2"><input type="submit" value="Submit" class="btn btn-primary"></td>
                </tr>

            </table>
        </form>
        
        
    </div>
    
</body>
</html>
